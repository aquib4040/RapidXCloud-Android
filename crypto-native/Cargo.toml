[package]
name = "rapidxclouddrive-crypto"
version = "2.0.0"
edition = "2021"
authors = ["RapidXCloud Cryptography Team"]
description = "Memory-safe native cryptographic & MTProto engine for RapidXCloud"

[lib]
name = "canondrive_crypto"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rapidxcloud-crypto-core = { path = "../../crypto/core" }
jni = { version = "0.21", default-features = false }
grammers-tl-types = "0.12.0"
zeroize = "1"
