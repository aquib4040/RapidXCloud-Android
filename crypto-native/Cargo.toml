[package]
name = "canondrive-crypto"
version = "1.0.0"
edition = "2021"
authors = ["CanonDrive Team"]
description = "Memory-safe native cryptographic engine for CanonDrive Android app"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
aes-gcm = "0.10"
subtle = "2.5"
base64ct = { version = "1.6", features = ["alloc"] }
