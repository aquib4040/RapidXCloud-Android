name: Build & Release RapidXCloud Android

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Release notes or summary'
        required: false
        default: 'Official open-source release with zero-knowledge E2EE and automated BYOS backup.'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  code-audit:
    name: Code Quality & Bug Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Native Crypto Bug Check
        run: |
          cd crypto-native
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test --verbose

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Android Lint & Unit Tests
        run: ./gradlew lintRelease testReleaseUnitTest

  build-and-release:
    name: Compile Multi-Architecture APKs & Release
    needs: code-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust Toolchain for Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Compile Native Rust Crypto for all ABIs
        run: |
          cd crypto-native
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          mkdir -p ../app/src/main/jniLibs/armeabi-v7a
          mkdir -p ../app/src/main/jniLibs/x86_64
          mkdir -p ../app/src/main/jniLibs/x86

          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../app/src/main/jniLibs build --release

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Universal & Per-ABI APKs
        run: ./gradlew assembleRelease

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-apks
          # Find all produced APKs and collect them
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-apks/ \;
          cd release-apks
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: RapidXCloud Android ${{ github.event.inputs.version_tag || github.ref_name }}
          body: |
            ## RapidXCloud Android Official Release

            ${{ github.event.inputs.release_notes || 'Zero-knowledge end-to-end encrypted cloud drive with automated BYOS background backup.' }}

            ### Architectural Features
            - **1:1 WebCrypto Parity**: Argon2id master key unwrapping + HKDF-SHA256 + 4MB streaming AES-256-GCM chunks.
            - **Dual-Key Split (Proton-style)**: `FileKey = ClientShare ⊕ ServerShare` (defense-in-depth). Supports Solo User Key mode.
            - **Automated Mobile Backup**: Exclusively for BYOS (Private Node) users with folder structure preservation (`Mobile Backup/...`).
            - **Direct Folder Download**: Downloads recursive folder trees to `Downloads/CanonDrive/` without server zipping.
            - **URL Leech**: Stream selection, custom titles, intro subtitles, and cloud-side leeching.
            - **Multi-Architecture Support**: Built for `arm64-v8a`, `armeabi-v7a`, `x86_64`, `x86`, and universal devices.

            ### Integrity Checksums (SHA-256)
            ```
            $(cat release-apks/SHA256SUMS.txt)
            ```
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
